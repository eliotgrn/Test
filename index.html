    h = `<h1>Mes tests<small>${b ? "Dernier bilan le " + G.frD(b.date) : "Pas encore de bilan"}</small></h1>`;
    if (b) h += `<section class="sec"><h2>Mes progrès</h2><div class="card">${radars(j, b, pv)}${pv ? `<p class="msg" style="margin:6px 0 0">Les pointillés, c'est ton bilan d'avant (${G.frD(pv.date)}). Le cercle vert, c'est le niveau 3 : celui des meilleurs de ton âge.</p>` : ""}</div></section>
      <section class="sec"><h2>Mes résultats</h2>${testsHTML(j, b)}</section>
      <div class="cols"><section class="sec"><h2>Mes points forts</h2>${axesHTML(j, b, v => v >= 3.5, "Ils apparaîtront avec tes prochains bilans.")}</section><section class="sec"><h2>Ce que je travaille</h2>${axesHTML(j, b, v => v < 3, "Aucune ligne sous le niveau 3.")}</section></div>`;
    else h += `<div class="sec">` + empty("Ton coach fera bientôt ton premier bilan : tu verras ici ton profil et tes progrès.") + `</div>`;

  }
  if (onglet === "seance") {

    h = `<h1>Ma séance<small>${dLong(t)}</small></h1><div class="sec bigs">${nxCard(j, nx)}<a class="big" href="#" data-a="monwu" style="--bc:var(--create)"><span class="k">Mon échauffement</span><b>Prépare ton échauffement</b><span>Durée, ce qui suit, lieu : trois choix suffisent.</span></a></div>

  h = `<h1>Salut ${esc(prenom(j))} !<small>${dLong(t)}${ageTxt(j) ? " · " + ageTxt(j) : ""}</small></h1>
    <div class="sec bigs">${nxCard(j, nx)}<a class="big" href="#" data-a="monwu" style="--bc:var(--create)"><span class="k">Mon échauffement</span><b>Prépare ton échauffement</b><span>Durée, ce qui suit, lieu : trois choix suffisent.</span></a></div>
    <div class="cols"><section class="sec"><h2>Ma forme du jour</h2><div class="card">${fj ? `<p style="margin:0 0 8px"><b>Merci, c'est noté !</b> <span class="msg">${nf(formeScore(fj))} / 5 · tu peux corriger si besoin.</span></p>` : `<p class="msg" style="margin:0 0 8px">30 secondes pour dire à ton coach comment tu te sens.</p>`}${formeForm(j, true)}</div></section>
    <section class="sec"><h2>Retour après séance</h2><div class="card">${retourForm(j, true)}</div></section></div>`;

function nxCard(j, e) {

}

    if (!ex) { const j = { ...p, id: p.id || G.uid(), sexe: p.sexe === "F" ? "F" : "G", bilans: bil }; delete j.valeurs; s.joueurs.push(j); n++; continue; }
    for (const k in p) if (k !== "bilans" && k !== "id" && (ex[k] == null || ex[k] === "" || (Array.isArray(ex[k]) && !ex[k].length))) ex[k] = p[k];
    ex.bilans = arr(ex.bilans); for (const b of bil) if (!ex.bilans.some(x => x.id === b.id || (x.date === b.date && x.age === b.age))) ex.bilans.push(b);

/* ================= TESTS ET PROFILAGE (1er nov., retour 16) =================
   Un seul écran : le profil radar (le dernier niveau connu de chaque qualité, avec sa date), les qualités, et les bilans.
   « + Bilan » : la date, ce qu'on a fait, puis seulement les qualités testées ; chaque test se choisit dans la banque (fiche de mise en place,
   barème de l'âge et du sexe) ; la mesure donne le niveau 1-4, que le coach peut aussi poser à la main. Un bilan peut être créé à l'avance. */
const pfBilansTous = j => arr(j && j.bilans).filter(b => b && isoOk(b.date)).slice().sort((a, b) => b.date.localeCompare(a.date));
function pfDernier(j) {   /* par qualité : le dernier niveau connu (bilans faits), sa date et le test */
  const L = LN("PP"), B = pfBilansTous(j).filter(b => b.date <= G.today());
  return L.map((n, i) => { for (const b of B) { const v = vOf(b, "PP")[i]; if (v != null && v !== "" && !isNaN(+v)) { const tid = Object.keys(b.res || {}).find(t => pfLigneTest(t) === i); return { n, i, v: +v, date: b.date, tid }; } } return { n, i, v: null }; });
}
const pfLigneTest = tid => { const t = (RD.tests || []).find(x => x.id === tid), m = t && /ligne (\d+)/.exec(t.l || ""); return m ? +m[1] - 1 : -1; };
function pfRadar(D) {   /* radar simple : 12 axes, anneau du niveau 3 */
  const N = D.length, R0 = 120, cx = 160, cy = 150, pt = (i, r) => [cx + r * Math.sin(2 * Math.PI * i / N), cy - r * Math.cos(2 * Math.PI * i / N)];
  const ring = lv => D.map((_, i) => pt(i, R0 * lv / 4).map(x => x.toFixed(1)).join(",")).join(" ");
  const poly = D.map((d, i) => pt(i, R0 * (d.v || 0) / 4).map(x => x.toFixed(1)).join(",")).join(" ");
  return `<svg viewBox="0 0 320 300" style="width:100%;max-width:420px;display:block;margin:0 auto" role="img" aria-label="Profil radar">
    ${[1, 2, 4].map(l => `<polygon points="${ring(l)}" fill="none" stroke="rgba(140,154,147,.25)"/>`).join("")}<polygon points="${ring(3)}" fill="none" stroke="#3BE08A" stroke-width="2.5"/>
    ${D.map((_, i) => { const [x, y] = pt(i, R0); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(140,154,147,.2)"/>`; }).join("")}
    ${D.some(d => d.v) ? `<polygon points="${poly}" fill="rgba(228,255,58,.22)" stroke="#E4FF3A" stroke-width="2"/>` : ""}

   « Terminer la saison » : la saison est archivée (tout reste consultable et modifiable) et la suivante est créée, reliée à elle.
   Repris : staff, semaine type, horaires de cours, consignes en cours, réglages du moteur, objectifs (court terme = « objectifs de la saison suivante » du bilan).
   Côté joueur (déjà commun aux saisons) : profil, croissance, mesures, blessures, antécédents, bilans de tests et profilage.
   En continu : la charge (ACWR, EWMA), la forme et la douleur lisent la fin de la saison d'avant.

    ${m.resume ? `<p style="margin:10px 0 0;line-height:1.45">${esc(m.resume)}</p>` : ""}
    ${arr(m.objectifs).length ? `<div class="pf-fx"><span class="lab">Objectifs</span><p>${arr(m.objectifs).map(esc).join(" · ")}</p></div>` : ""}
    <div class="pf-fx"><span class="lab">Déroulé</span></div><ol class="pf-exl">${S.map((x, i) => `<li><div class="pf-wr"><span class="pf-n">${String(i + 1).padStart(2, "0")}</span><span class="pf-et"><b>${esc(x.n)}</b><small>${esc([x.series, x.duree ? Math.round(x.duree) + " s" : "", WU_PH[x.phase] || ""].filter(Boolean).join(" · "))}</small></span></div></li>`).join("")}</ol>`,
    principal: o.pick ? { t: o.pickTxt || "Choisir pour cette séance", fn: () => { o.pick(m); } } : undefined });
}
function pfBanqueWu(p, s, onPick, o = {}) {
  wuP.then(() => {
    const sh = G.ui.sheet({ titre: "Banque d'échauffements", large: true, html: `<input class="gs-inp" id="pf-bw" placeholder="Accès direct : chercher dans tous les échauffements" autocomplete="off" aria-label="Chercher un échauffement"><div id="pf-bwr" style="margin-top:12px"></div>` });
    const a0 = Math.floor(pfRef(p).a || 14), okA = m => !m.ages || !m.ages.conseille || (a0 >= m.ages.conseille[0] && a0 <= m.ages.conseille[1]);
    const tous = Object.values(WUN).filter(m => m.type === "warmup").sort((x2, y2) => (okA(y2) ? 1 : 0) - (okA(x2) ? 1 : 0)), top = s ? pfWuModeles(p, s).slice(0, 8) : tous.filter(okA).slice(0, 12);
    const ligne = m => `<li><button type="button" data-bw="${esc(m.id)}"><span class="pf-et"><b>${esc(m.nom)}</b><small>${esc([(+m.duree || "") + " min", arr(m.situations).length + " situations", m.ages && m.ages.conseille ? m.ages.conseille.join("-") + " ans" : ""].filter(Boolean).join(" · "))}</small></span><span class="pf-ch">›</span></button></li>`;
    const draw = () => { const Rm = pfMots(sh.$("#pf-bw").value.trim());
      if (!Rm.length) { sh.$("#pf-bwr").innerHTML = `<div class="pf-day" style="margin-top:0">${s ? "Les plus adaptés à cette séance" : "Les plus adaptés à son âge"}</div><ol class="pf-exl">${top.map(ligne).join("")}</ol><p class="msg">Tape un ou plusieurs mots pour chercher dans tous les échauffements.</p>`; return; }
      const L = tous.filter(m => pfCherche([m.nom, m.resume, arr(m.objectifs).join(" "), arr(m.situations).map(x => x.n).join(" ")].join(" "), Rm)).sort((x2, y2) => (Rm.filter(r => r.test(fold(y2.nom))).length * 3 + (okA(y2) ? 2 : 0)) - (Rm.filter(r => r.test(fold(x2.nom))).length * 3 + (okA(x2) ? 2 : 0)));
      sh.$("#pf-bwr").innerHTML = L.length ? `<ol class="pf-exl">${L.map(ligne).join("")}</ol>` : `<p class="msg">Aucun échauffement ne contient tous ces mots.</p>`; };
    sh.$("#pf-bw").addEventListener("input", draw); draw();
    sh.el.addEventListener("click", ev => { const b = ev.target.closest("[data-bw]"); if (!b) return; const m = WUN[b.dataset.bw]; if (!m) return;
      pfFicheWu(m, { pick: m2 => { onPick(m2); sh.fermer(true); }, pickTxt: o.pickTxt }); }); });
}
(function () { const st = document.createElement("style"); st.textContent = `.pf-fx{margin-top:14px}.pf-fx .lab{display:block;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc2,#3BE08A);font-weight:700;margin-bottom:4px}.pf-fx p{margin:0;line-height:1.45}
.pf-frise{display:flex;gap:3px;height:10px;margin:14px 0 6px}.pf-frise i{border-radius:3px}.pf-wr{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:56px}
.pf-leg em{display:inline-block;width:9px;height:9px;border-radius:50%}`; document.head.appendChild(st); })();

/* ENVOYER UN ÉCHAUFFEMENT (retour 17) : rien d'imposé ; on le choisit dans la banque ou on le crée, puis on l'envoie */
function vPWuEnvoi(p) {
  const id = esc(p.id), D = p.wuDraft || {}, L = arr(D.ex), m = D.ref ? WUN[D.ref] : null;
  if (!Object.keys(WUN).length) wuP.then(() => render(true));
  document.title = "Envoyer un échauffement · " + pfNom(p);
  main.innerHTML = pfHx("Un échauffement", `${esc(pfNom(p))} · <a href="#/perf/p/${id}/envoyer">Envoyer</a>`, "#/perf/p/" + p.id + "/envoyer") + `<div class="pg">
    ${L.length ? `<div class="pf-sum"><div class="pf-sum-t"><b>${esc(D.nom || "Mon échauffement")}</b></div><div class="pf-tags">${[m ? (+m.duree || "") + " min" : "", L.length + " situations", m ? "tout prêt" + (D.modif ? ", modifié" : "") : "créé par toi"].filter(Boolean).map(t => `<span>${esc(t)}</span>`).join("")}</div>
      <div class="pf-sum-a"><button class="ib sm" data-pf="wedchoix" data-p="${id}">Changer</button>${m ? `<button class="ib sm" data-pf="wedfiche" data-p="${id}">Voir la fiche</button>` : ""}</div></div>
      <section class="sec"><h2 class="pf-h2">Situations <span class="pf-k">${L.length}</span></h2><ol class="pf-exl">${L.map((e, i) => `<li><button type="button" data-pf="wedex" data-p="${id}" data-i="${i}"><span class="pf-n">${String(i + 1).padStart(2, "0")}</span><span class="pf-et"><b>${esc(e.n)}</b><small>${esc(e.dz || "dosage à préciser")}</small></span><span class="pf-ch">›</span></button></li>`).join("")}</ol>
      <div class="pf-act"><button class="go acc" data-pf="wedajout" data-p="${id}">+ Ajouter une situation</button><button class="ib" data-pf="wedvider" data-p="${id}">Vider</button></div></section>
      <section class="sec"><button class="go acc big" style="width:100%;min-height:52px" data-pf="wedenv" data-p="${id}">Envoyer au joueur</button></section>`
    : `<section class="sec"><div class="pf-vide"><b>Quel échauffement envoyer ?</b><p>Choisis-le dans la banque (tu peux ensuite le modifier) ou crée le tien situation par situation.</p>
      <div class="pf-act" style="justify-content:center"><button class="go acc" data-pf="wedchoix" data-p="${id}">Choisir dans la banque</button><button class="ib" data-pf="wedajout" data-p="${id}">Créer le mien</button></div></div></section>`}</div>`;
}
Object.assign(PFA, {
  wedchoix(b) { pfVersWarmup(PJ.get(b.dataset.p), null, "wed"); },
  wedfiche(b) { const p = PJ.get(b.dataset.p); wuP.then(() => { const m = p.wuDraft && WUN[p.wuDraft.ref]; if (m) pfFicheWu(m); }); },
  wedajout(b) { const pid = b.dataset.p, p = PJ.get(pid), s0 = { key: "", disc: "pp", date: G.today(), duree: 15, n: 1 };
    const ajoute = e2 => { const p2 = PJ.get(pid); p2.wuDraft = p2.wuDraft || { nom: "Mon échauffement", ex: [] }; p2.wuDraft.ex = [...arr(p2.wuDraft.ex), e2]; if (p2.wuDraft.ref) p2.wuDraft.modif = true; PJ.save(p2); };
    const sh = G.ui.sheet({ titre: "Ajouter une situation", html: `<div class="pf-choix"><button type="button" data-c="banque"><b>La banque d'exercices</b><small>Échauffement et mobilité en premier, puis toute la banque</small></button><button type="button" data-c="moi"><b>Ma situation</b><small>La tienne, en une ligne</small></button></div>` });
    sh.el.addEventListener("click", e => { const c = e.target.closest("[data-c]"); if (!c) return; sh.fermer(true);
      if (c.dataset.c === "banque") pfVersBanque(p, null, "wedex");
      else setTimeout(() => pfFeuille("Ma situation", [{ n: "n", lab: "Nom", ph: "Ex. Montées de genoux sur place" }, { n: "dz", lab: "Dosage", ph: "Ex. 2 × 20 s" }], o => { if (!o.n) return "Donne un nom."; ajoute({ id: null, n: o.n, dz: o.dz }); }), 180); }); },
  wedex(b) { const pid = b.dataset.p, i = +b.dataset.i, e = arr((PJ.get(pid).wuDraft || {}).ex)[i]; if (!e) return;
    const sh = G.ui.sheet({ titre: e.n, html: `<form class="gs-form"><label class="gs-l">Dosage<textarea class="gs-inp" name="dz" rows="3">${esc(e.dz || "")}</textarea></label></form><div class="pf-sum-a" style="margin-top:12px">${e.id || e.de ? `<button type="button" class="ib sm" data-o="fiche">Voir la fiche</button>` : ""}<button type="button" class="ib sm" data-o="del">Retirer</button></div>`,
      principal: { t: "Enregistrer", fn: s2 => { const p = PJ.get(pid); p.wuDraft.ex[i].dz = String(new FormData(s2.$("form")).get("dz") || "").trim(); PJ.save(p); } } });
    sh.el.addEventListener("click", ev => { const o = ev.target.closest("[data-o]"); if (!o) return; if (o.dataset.o === "fiche") { if (!e.id) { G.ui.sheet({ titre: e.n, html: `<div class="pf-fx"><span class="lab">Déroulement</span><p>${esc(pfMaj(e.de))}</p></div>` }); return; } pfBanque().then(() => { const ex = PFB.B.ex.find(z => z.id === e.id); if (ex) pfFicheEx(ex, { dz: e.dz }); }); return; }
      const p = PJ.get(pid); p.wuDraft.ex.splice(i, 1); PJ.save(p); sh.fermer(true); }); },
  wedvider(b) { if (!confirmer(b, "Toucher encore pour vider")) return; const p = PJ.get(b.dataset.p); delete p.wuDraft; PJ.save(p); },
  wedenv(b) { const p = PJ.get(b.dataset.p), D = p.wuDraft || {}; pfPartager(p, "#/vu/", { v: 1, n: pfNom(p), d: G.today(), di: "wu", wo: 1, wn: D.nom || "Échauffement", wu: arr(D.ex).map(e => [e.id || "", e.n, pfPourJoueur(e.dz)]) }, "Lien à envoyer à " + prenom(pfJoueurs(p)[0] || { nom: "ton joueur" }), "Ton échauffement : ouvre ce lien.").catch(() => toast("Envoi impossible sur cet appareil.")); }
});

/* ================= ONGLET ÉCHAUFFEMENT DE LA SÉANCE (1er nov.) =================
   Même disposition que la séance : un résumé, la liste numérotée des situations, une feuille par situation.
   On choisit un échauffement tout prêt en entier (banque de warm-up), on le modifie, ou on le crée. Il part avec la séance quand on l'envoie au joueur. */
const WU_PH = { MR: "Mise en route", MO: "Mobilité", AC: "Activation", PO: "Potentialisation", SP: "Spécifique", RC: "Retour au calme" };
function pfWuQuand(p, s) { const comp = pfBloque(p, s.date) === "comp" || arr(p.comps).some(c => pfIn(add(s.date, 1), c.debut, c.fin));
  if (comp) return ["match", "tournoi"]; if (s.disc === "pp") return s.obj === "Endurance" ? ["pp_endurance", "entrainement"] : /Force/.test(s.obj || "") ? ["pp_force", "entrainement"] : ["pp_vitesse", "entrainement"]; return ["entrainement"]; }
function pfWuModeles(p, s) { const a = Math.floor(pfRef(p).a || 14), Q = pfWuQuand(p, s), cible = s.duree >= 75 ? 15 : s.duree >= 45 ? 12 : 8;
  return Object.values(WUN).filter(m => m.type === "warmup" && (!m.ages || !m.ages.conseille || (a >= m.ages.conseille[0] && a <= m.ages.conseille[1])))
    .map(m => ({ m, sc: (arr(m.quand).some(q => Q[0] === q) ? 0 : arr(m.quand).some(q => Q.includes(q)) ? 1 : 3) * 10 + Math.abs((+m.duree || 10) - cible) }))
    .sort((x, y) => x.sc - y.sc).map(x => x.m); }
const pfWuEx = m => arr(m.situations).map(t => ({ id: t.exo || null, de: t.de || "", n: t.n, dz: [t.series, t.duree ? Math.round(t.duree) + " s" : "", WU_PH[t.phase] || ""].filter(Boolean).join(" · ") }));
function vPSeanceWU(p, s, w, x, id, k, onglets) {
  const wu = x.wu || {}, L = arr(wu.ex), m = wu.ref ? WUN[wu.ref] : null;
  if (!Object.keys(WUN).length) { wuP.then(() => render(true)); }
  const resume = L.length ? `<div class="pf-sum"><div class="pf-sum-t"><b>${esc(wu.nom || "Échauffement")}</b></div>
    <div class="pf-tags">${[m ? (+m.duree || "") + " min" : "", m && m.intensite_fin ? m.intensite_fin : "", m ? "tout prêt" + (wu.modif ? ", modifié" : "") : "créé pour cette séance"].filter(Boolean).map(t => `<span>${esc(t)}</span>`).join("")}</div>
    ${m && m.resume ? `<p class="msg" style="margin:10px 0 0">${esc(m.resume)}</p>` : ""}
    <div class="pf-sum-a"><button class="ib sm" data-pf="wuchoix" data-p="${id}" data-k="${k}">Changer d'échauffement</button>${m ? `<button class="ib sm" data-pf="wufiche" data-p="${id}" data-k="${k}">Voir la fiche</button>` : ""}</div></div>` : "";
  const liste = L.length ? `<ol class="pf-exl">${L.map((e, i) => `<li><button type="button" data-pf="exfiche" data-l="wu" data-p="${id}" data-k="${k}" data-i="${i}"><span class="pf-n">${String(i + 1).padStart(2, "0")}</span><span class="pf-et"><b>${esc(e.n)}</b>${e.dz ? `<small>${esc(e.dz)}</small>` : `<small class="pf-dz0">dosage à préciser</small>`}</span><span class="pf-ch" aria-hidden="true">›</span></button></li>`).join("")}</ol>` : "";
  main.innerHTML = pfHx(`${esc(J7[s.j])} ${esc(dCourt(s.date))}`, (p.nature === "unite" ? `${pfBaseLien(p)} · ${esc(DISC[s.disc])}` : `<a href="#/perf/p/${id}">${esc(pfNom(p))}</a> · <a href="#/perf/p/${id}/w/${w.d1}">S${w.i + 1}</a>`), (p.nature === "unite" ? pfBase(p) : "#/perf/p/" + p.id + "/w/" + w.d1)) + `<div class="pg">
    ${onglets}${p.grp ? `<p class="msg" style="margin:0 0 10px">Échauffement commun à tout le groupe${arr(p.grp.joueurs).length ? " (" + arr(p.grp.joueurs).length + " joueurs)" : p.grp.n ? " (" + p.grp.n + " joueurs)" : ""}, même si la séance ne concerne qu'une partie des joueurs.</p>` : ""}${resume}
    ${L.length ? `<section class="sec"><h2 class="pf-h2">Situations <span class="pf-k">${L.length}</span></h2>${liste}
      <div class="pf-act"><button class="go acc" data-pf="wuajout" data-p="${id}" data-k="${k}">+ Ajouter une situation</button><button class="ib" data-pf="wuvider" data-p="${id}" data-k="${k}">Vider</button></div></section>`
    : `<section class="sec"><div class="pf-vide"><b>Pas encore d'échauffement</b><p>Choisis-le dans la banque, laisse GRÜN le proposer, ou crée le tien.</p>
      <div class="pf-act" style="justify-content:center"><button class="go acc" data-pf="wuchoix" data-p="${id}" data-k="${k}">Choisir dans la banque</button><button class="ib" data-pf="wuauto" data-p="${id}" data-k="${k}">Proposer un échauffement</button><button class="ib" data-pf="wuajout" data-p="${id}" data-k="${k}">Créer le mien</button></div></div></section>`}
    ${p.grp || p.auto ? "" : `<section class="sec"><button class="go acc big" style="width:100%;min-height:52px" data-pf="envoyer" data-p="${id}" data-k="${k}"${arr(x.ex).length ? "" : " disabled"}>Envoyer au joueur</button>${arr(x.ex).length ? "" : `<p class="msg">Prépare d'abord la séance pour pouvoir l'envoyer.</p>`}</section>`}</div>`;
}
const pfWuSet = (pid, k, m) => { const p = PJ.get(pid), x = pfSe(p, k), s = pfFind(p, k); x.wu = { ref: m.id, nom: m.nom, ex: pfWuEx(m) }; if (s) pfAjusterDuree(s, x); PJ.save(p); };
Object.assign(PFA, {
  wuchoix(b) { const p = PJ.get(b.dataset.p); pfVersWarmup(p, pfFind(p, b.dataset.k), "wu"); },
  wuauto(b) { const pid = b.dataset.p, k = b.dataset.k; wuP.then(() => { const p = PJ.get(pid), M = pfWuModeles(p, pfFind(p, k)); if (!M.length) { toast("Aucun échauffement adapté trouvé."); return; } pfWuSet(pid, k, M[0]); toast("Proposé : " + M[0].nom); }); },
  wufiche(b) { const p = PJ.get(b.dataset.p), x = pfSe(p, b.dataset.k); wuP.then(() => { const m = x.wu && WUN[x.wu.ref]; if (m) pfFicheWu(m); }); },
  wuvider(b) { const p = PJ.get(b.dataset.p), x = pfSe(p, b.dataset.k), av = x.wu; delete x.wu; PJ.save(p); G.ui.annuler("Échauffement retiré", () => { const p2 = PJ.get(p.id); pfSe(p2, b.dataset.k).wu = av; PJ.save(p2); }); },
  wuajout(b) { const pid = b.dataset.p, k = b.dataset.k;
    const sh = G.ui.sheet({ titre: "Ajouter une situation", html: `<div class="pf-choix"><button type="button" data-c="banque"><b>Chercher dans la banque</b><small>Échauffements et mobilité, par mot ou par rubrique</small></button><button type="button" data-c="moi"><b>Ma situation</b><small>La tienne, en une ligne</small></button></div>` });
    const ajoute = e2 => { const p2 = PJ.get(pid), x2 = pfSe(p2, k); x2.wu = x2.wu || { nom: "Échauffement", ex: [] }; x2.wu.ex = [...arr(x2.wu.ex), e2]; if (x2.wu.ref) x2.wu.modif = true; PJ.save(p2); };
    sh.el.addEventListener("click", e => { const c = e.target.closest("[data-c]"); if (!c) return; sh.fermer(true); const p = PJ.get(pid), s = pfFind(p, k), x = pfSe(p, k);
      if (c.dataset.c === "banque") pfVersBanque(p, s, "wuex");
      if (c.dataset.c === "moi") setTimeout(() => pfFeuille("Ma situation", [{ n: "n", lab: "Nom", ph: "Ex. Montées de genoux sur place" }, { n: "dz", lab: "Dosage", ph: "Ex. 2 × 20 s" }], o => { if (!o.n) return "Donne un nom."; ajoute({ id: null, n: o.n, dz: o.dz }); }), 180); }); }
});
(function () { const st = document.createElement("style"); st.textContent = `.pf-ong{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border:1px solid var(--line);border-radius:16px;background:var(--panel);margin:4px 0 12px}.pf-ong a{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:12px;color:var(--mute);text-decoration:none;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase}.pf-ong a[aria-selected="true"]{background:var(--acc);color:#07090A}.pf-ong small{font-family:var(--ui,inherit);font-weight:700;font-size:12px;opacity:.75}`; document.head.appendChild(st); })();

})();

</script>
